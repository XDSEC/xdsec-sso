services:
  sso-db:
    image: postgres:alpine
    ports:
      - 7091:5432
    volumes:
      - xdsec-sso-db:/data
    restart: always
    environment:
      POSTGRES_USER: xdsec-sso
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      PGDATA: /data
  sso-redis:
    image: redis:alpine
    ports:
      - 7092:6379
    restart: always
  sso-nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - ../web:/var/www/xdsec-sso
    network_mode: host
volumes:
  xdsec-sso-db: