[workspace]
members  = ['crates/*']
resolver = "3"

[workspace.package]
authors      = [ "jcshan709 <jcshan709@163.com>" ]
edition      = "2024"
homepage     = "xdsec.org"
publish      = false
repository   = "https://github.com/XDSEC/xdsec-sso"
rust-version = "1.100.0"
version      = "0.0.1"
license      = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow             = "1.0.105"
clap               = { version = "4.6.9", features = ["derive"] }
sea-orm            = { version = "2.0.4", features = ["sqlx-all", "runtime-tokio-native-tls"] }
serde              = { version = "1.0.229", features = ["derive"] }
serde_json         = "1.0.154"
thiserror          = "2.0.21"
time               = { version = "0.3.55", features = ["formatting", "serde"] }
tokio              = { version = "1.54.1", features = ["full"] }
toml               = "1.2.2"
tracing            = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding        = "2.1.3"

sso-common   = { path = "crates/common", package = "xdsec-sso-common" }
sso-config   = { path = "crates/config", package = "xdsec-sso-config" }
sso-database = { path = "crates/database",  package = "xdsec-sso-database" }